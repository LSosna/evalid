[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalid"
version = "0.3.4"
description = "A pre-registered identifiability protocol for bounding nuisance capacity in empirical claims"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lukas A. Sosna"}]
keywords = ["pre-registration", "audit", "identifiability", "benchmarks",
            "reproducibility", "degeneracy", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
audits = ["scipy>=1.11", "matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
evalid = "evalid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
